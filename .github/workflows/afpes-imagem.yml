# Imagem do servidor AFPES (hbbs + hbbr) publicada no GHCR.
# Roda os testes do módulo afpes antes de compilar (ver Dockerfile.afpes).
name: AFPES imagem do servidor

on:
  workflow_dispatch:
  push:
    branches: [afpes]
    tags: ['afpes-v*']

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/afpes/remoto-servidor
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/afpes' }}
            type=match,pattern=afpes-v(.*),group=1
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.afpes
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
